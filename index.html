<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>CogniTrack: skrining perkembangan anak</title>
<meta name="description" content="Skrining KPSP digital sesuai pedoman SDIDTK, verifikasi dokter melalui video, dan stimulasi yang diurutkan menurut hasil skrining.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4FB;--surface:#FFFFFF;--ink:#211B36;--muted:#6A6383;--line:#E3DEF1;
  --brand:#5B3FD0;--brand-ink:#FFFFFF;--tint:#EFEAFC;
  --d0:#6B4EE0;--d1:#E4572E;--d2:#16967F;--d3:#C98F00;
  --yes:#16967F;--some:#C98F00;--no:#7C7495;
  --warn-bg:#FFF3DC;--warn-ink:#5C3F00;--ok-bg:#E4F5F1;--ok-ink:#0B4A3E;--bad:#C2402A;--bad-bg:#FDE7E2;--bad-ink:#6B1E0E;
  --hf:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --bf:'Figtree','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15121F;--surface:#1F1B2E;--ink:#F0ECFA;--muted:#A79EC2;--line:#352F4D;
    --brand:#9A85FF;--brand-ink:#15121F;--tint:#2A2445;
    --d0:#9A85FF;--d1:#FF8562;--d2:#38C9AE;--d3:#F2B93B;
    --yes:#38C9AE;--some:#F2B93B;--no:#8F86AB;
    --warn-bg:#3A2E12;--warn-ink:#FFE2A6;--ok-bg:#12352F;--ok-ink:#B6F0E4;--bad:#FF8562;--bad-bg:#3D1A14;--bad-ink:#FFC9BC;
  }
}
:root[data-theme="dark"]{
  --bg:#15121F;--surface:#1F1B2E;--ink:#F0ECFA;--muted:#A79EC2;--line:#352F4D;
  --brand:#9A85FF;--brand-ink:#15121F;--tint:#2A2445;
  --d0:#9A85FF;--d1:#FF8562;--d2:#38C9AE;--d3:#F2B93B;
  --yes:#38C9AE;--some:#F2B93B;--no:#8F86AB;
  --warn-bg:#3A2E12;--warn-ink:#FFE2A6;--ok-bg:#12352F;--ok-ink:#B6F0E4;--bad:#FF8562;--bad-bg:#3D1A14;--bad-ink:#FFC9BC;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:1rem;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--hf);line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 56px}
 
/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0 16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--hf);font-size:1.25rem;letter-spacing:-.01em}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;max-width:180px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--d1);border-color:var(--d1)}
.btn.sm{padding:6px 12px;font-size:.9rem}
 
/* tabs */
.tabs{display:flex;gap:4px;background:var(--tint);border-radius:999px;padding:4px;margin-bottom:20px;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink)}
 
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.stack{display:grid;gap:16px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.title{font-size:1.9rem;margin-bottom:4px}
.h2{font-size:1.25rem;margin-bottom:12px}
.note{border-radius:14px;padding:12px 14px;font-size:.95rem}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)}
.note.ok{background:var(--ok-bg);color:var(--ok-ink)}
.note.info{background:var(--tint)}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){.grid2{grid-template-columns:minmax(0,320px) 1fr}}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=password],input[type=date],select.f,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.field{margin-bottom:14px}
.err{color:var(--d1);font-weight:600;margin-bottom:10px}
 
/* shared */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fs{display:flex;gap:4px}
.narrow{max-width:580px;margin:2vh auto 0}
.h3{font-size:1.05rem;margin:18px 0 8px}
.note.bad{background:var(--bad-bg);color:var(--bad-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;color:var(--brand);font-weight:600;text-decoration:underline}
.list{margin:0;padding-left:20px;display:grid;gap:4px}
.list.plain{list-style:none;padding-left:0}
.kv{display:grid;grid-template-columns:minmax(0,max-content) 1fr;gap:6px 16px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-bottom:12px}
.chk input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--brand)}
.fs-radio{border:0;padding:0;margin:14px 0 0}.fs-radio legend{font-weight:600;margin-bottom:8px}
.scroll{overflow-x:auto}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
@media (max-width:520px){
  .top{gap:8px}
  .brand{flex-basis:100%}
  .sel{padding:7px 10px;max-width:none;flex:1 1 140px;min-width:0}
  .tabs button{padding:9px 10px;font-size:.92rem}
}
.empty{text-align:center;padding:28px 12px}
.foot{margin-top:28px;font-size:.85rem;color:var(--muted)}
textarea{min-height:96px;resize:vertical}

/* skrining */
.item-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.num{font-family:var(--hf);font-weight:700;min-width:28px;height:28px;border-radius:50%;background:var(--tint);display:inline-grid;place-items:center;font-size:.9rem}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:600}
.tag i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tag.ghost{color:var(--muted);font-weight:500}
.q{font-size:1.08rem;margin-bottom:12px}
.q,.pre{white-space:pre-line}
.follow{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);display:grid;gap:8px}
.follow.ro{margin-top:10px;padding:8px 12px;gap:2px}
.follow textarea{min-height:64px}
.wrow{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}
.wrow input{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chipopt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500}
.chipopt[aria-checked="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.rrchk{margin:10px 0 0;color:var(--muted)}
.rr{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.seg button[disabled]{opacity:.45;cursor:not-allowed}
.kfig{margin:0 0 14px;display:grid;gap:6px;justify-items:start}
.kfig img{display:block;max-width:100%;max-height:200px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
details.guide{background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:14px}
details.guide summary{cursor:pointer;font-weight:600;color:var(--brand)}
details.guide .kv{margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;padding:8px 22px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="y"]{background:var(--yes);color:#fff}
.seg button[aria-pressed="true"][data-v="n"]{background:var(--no);color:#fff}

/* hasil */
.result{border-left:6px solid var(--line)}
.result.ok{border-left-color:var(--yes)}.result.warn{border-left-color:var(--some)}.result.bad{border-left-color:var(--bad)}.result.wait{border-left-color:var(--brand)}
.cat{font-size:1.7rem;margin:4px 0 6px}
.card .result{margin-top:14px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.85rem;font-weight:600;background:var(--tint)}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}.pill.bad{background:var(--bad-bg);color:var(--bad-ink)}

/* stimulasi */
.dom{display:grid;gap:10px}
.dom-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:5px;flex:none}
.tips{display:grid;gap:12px}
.tip{background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:18px;padding:16px 18px}
.tip h3{font-size:1.1rem;margin-bottom:6px}
.tip .for{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.stt{border:1.5px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.82rem;font-weight:600;margin-left:auto}

/* tabel */
.rt{width:100%;border-collapse:collapse;font-size:.95rem}
.rt td,.rt th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.rt th{font-family:var(--hf)}
.rt tr.corr td{background:var(--warn-bg);color:var(--warn-ink)}
.st{white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* dokter */
.qrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qmain{flex:1 1 240px;min-width:0}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:2px}
.stat b{font-family:var(--hf);font-size:1.6rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.9rem}
.thumb{position:relative;flex:none;width:112px;aspect-ratio:16/9;border-radius:12px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#15121F),#15121F)}
.thumb svg{width:26px;height:26px;opacity:.9}
.thumb em{position:absolute;right:6px;bottom:4px;font-style:normal;font-size:.72rem;background:rgba(0,0,0,.55);border-radius:6px;padding:0 5px}
.thumb.sm{width:84px}.thumb.sm svg{width:20px;height:20px}
.thumb.none{background:var(--tint);color:var(--muted);font-size:.8rem;text-align:center}
.dropzone{border-style:dashed;border-width:2px;text-align:center;display:grid;justify-items:center;gap:10px}
.dropzone>svg{width:40px;height:40px;color:var(--muted)}
.dropzone .note{text-align:left}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.clipbtn{border:0;background:none;padding:0;display:grid;gap:4px;justify-items:start;color:inherit}
.vpage{display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
@media (min-width:860px){.vpage{grid-template-columns:minmax(0,1fr) 300px}}
.player{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 90% at 50% 40%,color-mix(in srgb,var(--c) 45%,#1d1a2a),#0d0b14)}
.p-top{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;gap:8px;padding:12px 14px;font-weight:600;font-size:.9rem;background:linear-gradient(rgba(0,0,0,.5),transparent)}
.p-badge{background:rgba(255,255,255,.18);border-radius:99px;padding:1px 10px;font-size:.78rem;white-space:nowrap}
.p-kid{position:absolute;left:50%;bottom:0;width:38%;transform:translateX(-50%);color:rgba(255,255,255,.12)}
.p-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#15121F;display:grid;place-items:center}
.p-play svg{width:30px;height:30px}
.p-bar{position:absolute;inset:auto 0 0 0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.6));font-size:.8rem}
.p-track{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
.p-track i{display:block;height:100%;width:0;background:#fff}
.p-track i.run{animation:prog var(--dur) linear forwards}
@keyframes prog{to{width:100%}}
video.vreal{display:block;width:100%;aspect-ratio:16/9;border-radius:18px;background:#0d0b14}
label.btn{display:inline-block;cursor:pointer}
.who{display:grid;line-height:1.2;text-align:right}
label.btn.disabled{opacity:.5;cursor:not-allowed}
label.btn input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.vlist{list-style:none;margin:0;padding:0;display:grid;gap:6px;width:100%;text-align:left}
.vlist li{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.vlist .vn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.p-track i.run{animation:none;width:35%}}
.clips{display:grid;gap:4px;padding:14px}
.clip{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid transparent;background:none;border-radius:14px;padding:8px;color:inherit}
.clip:hover{background:var(--tint)}
.clip[aria-current="true"]{background:var(--tint);border-color:var(--brand)}
.clip-t{display:grid;gap:2px;min-width:0;font-size:.92rem}
.clip-t .muted{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.achip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.85rem;font-weight:600;background:var(--tint)}
.achip.y{background:var(--ok-bg);color:var(--ok-ink)}.achip.n{background:var(--tint);color:var(--ink)}
.vrow2{padding:14px 0;border-top:1px solid var(--line)}
.vrow2 p{margin-bottom:8px}
.vans{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.corr-lbl{display:none;font-weight:600;color:var(--warn-ink);background:var(--warn-bg);border-radius:99px;padding:2px 10px}
.vrow2.corr .corr-lbl{display:inline-block}

@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#ccc}
  body{background:#fff}
  .noprint{display:none!important}
  .card{border:0;padding:0}
  .wrap{padding:0}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<noscript><p style="padding:16px">CogniTrack membutuhkan JavaScript.</p></noscript>
<script src="js/kpsp.js"></script>
<script src="js/stimulasi.js"></script>
<script src="js/lanjutan.js"></script>
<script src="js/app.js"></script>
</body>
</html>
